---
name: "[Workflow] Infra - Env"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      release_version:
        required: true
        type: string
      working-directory:
        required: true
        type: string
    secrets:
      TF_STATE_BUCKET:
        required: true
      AWS_ROLE_ARN:
        required: true

jobs:
  deploy:
    name: Deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Terraform Init
        run: just init ${INPUTS_ENVIRONMENT}
        env:
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}

      - name: Terraform Workspace
        run: just workspace ${INPUTS_ENVIRONMENT}
        env:
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}

      - name: Terraform Plan
        run: just plan ${INPUTS_ENVIRONMENT} -var="release_version=${INPUTS_RELEASE_VERSION}"
        env:
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          INPUTS_RELEASE_VERSION: ${{ inputs.release_version }}

      - name: Terraform Apply
        run: just apply ${INPUTS_ENVIRONMENT} --auto-approve -var="release_version=${INPUTS_RELEASE_VERSION}"
        env:
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          INPUTS_RELEASE_VERSION: ${{ inputs.release_version }}
