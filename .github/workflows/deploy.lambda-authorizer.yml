---
name: "λ - Authorizer"
run-name: >-
  ${{
    github.event_name == 'push'
    && github.event.head_commit.message
    || format('Manual deploy #{0}', github.run_number)
  }}

on:
  push:
    branches:
      - main
    paths:
      - 'services/authorizer/**'
      - '.github/workflows/deploy.lambda-authorizer.yml'
      - '.github/worlflows/_deploy.lambda-env.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-qa:
    name: Terraform QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Terraform QA
        uses: ./.github/actions/terraform-qa
        with:
          working-directory: services/authorizer/infra

  code-qa:
    name: Code QA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Install dependencies
        run: just sync authorizer

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          log=$(mktemp)
          echo "log=$log" >> "$GITHUB_OUTPUT"
          just services::authorizer::lint 2>&1 | tee "$log"

      - name: Test
        id: test
        continue-on-error: true
        run: |
          log=$(mktemp)
          echo "log=$log" >> "$GITHUB_OUTPUT"
          just services::authorizer::test 2>&1 | tee "$log"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          log=$(mktemp)
          echo "log=$log" >> "$GITHUB_OUTPUT"
          just services::authorizer::build 2>&1 | tee "$log"

      - name: QA Summary
        if: always()
        run: |
          print_result() {
            name="$1"; outcome="$2"; log="$3"
            if [ "$outcome" = "success" ]; then
              echo "🟢 $name"
            else
              echo "🔴 $name"
              echo
              echo '```'
              cat "$log" 2>/dev/null
              echo '```'
            fi
            echo
          }
          {
            print_result "Lint" "${{ steps.lint.outcome }}" "${{ steps.lint.outputs.log }}"
            print_result "Test" "${{ steps.test.outcome }}" "${{ steps.test.outputs.log }}"
            print_result "Build" "${{ steps.build.outcome }}" "${{ steps.build.outputs.log }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce QA result
        if: always()
        run: |
          for outcome in "${{ steps.lint.outcome }}" "${{ steps.test.outcome }}" "${{ steps.build.outcome }}"; do
            if [ "$outcome" != "success" ]; then
              echo "One or more QA checks failed. See summary above."
              exit 1
            fi
          done


  release:
    name: Semantic Release
    needs: [terraform-qa, code-qa]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      new_release_published: ${{ steps.release.outputs.new_release_published }}
      new_release_version: ${{ steps.release.outputs.new_release_version }}
    defaults:
      run:
        working-directory: services/authorizer

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run semantic-release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx -y semantic-release@25
          NEW_TAG=$(git tag --points-at HEAD --list 'authorizer-v*' | head -n1)
          if [ -n "$NEW_TAG" ]; then
            echo "new_release_published=true" >> "$GITHUB_OUTPUT"
            echo "new_release_version=${NEW_TAG#authorizer-v}" >> "$GITHUB_OUTPUT"
          else
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release Summary
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="authorizer-v${{ steps.release.outputs.new_release_version }}"
          {
            echo "## 🚀 New Release: $TAG"
            echo
            echo "- **Version:** ${{ steps.release.outputs.new_release_version }}"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Release:** $(gh release view "$TAG" --json url -q .url)"
            echo
            echo "### Release Notes"
            gh release view "$TAG" --json body -q .body
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    name: Deploy (dev)
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/_deploy.lambda-env.yml
    with:
      environment: dev
      service: authorizer
      version: v${{ needs.release.outputs.new_release_version }}
    secrets: inherit

  # deploy-prod:
  #   name: Deploy (prod)
  #   needs: [release, deploy-dev]
  #   if: needs.release.outputs.new_release_published == 'true'
  #   permissions:
  #     id-token: write
  #     contents: read
  #   uses: ./.github/workflows/_deploy.lambda-env.yml
  #   with:
  #     environment: prod
  #     service: authorizer
  #     version: v${{ needs.release.outputs.new_release_version }}
  #   secrets: inherit
