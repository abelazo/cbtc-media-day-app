---
name: "[Workflow] λ - Env"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      service:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true
      TF_STATE_BUCKET:
        required: true
      TF_LAMBDA_SOURCES_BUCKET:
        required: true
      TF_LAMBDA_SIGNING_PROFILE:
        required: true

jobs:
  upload:
    name: Upload λ source (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: services/${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Upload λ source
        run: |
          just build
          just upload "${INPUTS_VERSION}"
        env:
          TF_LAMBDA_SOURCES_BUCKET: ${{ secrets.TF_LAMBDA_SOURCES_BUCKET }}
          TF_LAMBDA_SIGNING_PROFILE: ${{ secrets.TF_LAMBDA_SIGNING_PROFILE }}
          INPUTS_VERSION: ${{ inputs.version }}

  infra:
    name: Infra (${{ inputs.environment }})
    needs: upload
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: write
    defaults:
      run:
        working-directory: services/${{ inputs.service }}/infra
    env:
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Terraform Init
        run: just init ${INPUTS_ENVIRONMENT}
        env:
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}

      - name: Terraform Workspace
        run: just workspace ${INPUTS_ENVIRONMENT}
        env:
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}

      - name: Terraform Plan
        run: just plan ${INPUTS_ENVIRONMENT} -var="release_version=${INPUTS_VERSION}"
        env:
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          INPUTS_VERSION: ${{ inputs.version }}

      - name: Terraform Apply
        run: just apply ${INPUTS_ENVIRONMENT} --auto-approve -var="release_version=${INPUTS_VERSION}"
        env:
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          INPUTS_VERSION: ${{ inputs.version }}

  update-code:
    name: Update λ Code (${{ inputs.environment }})
    needs: infra
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: services/${{ inputs.service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Update λ code
        run: just update-lambda-code "${INPUTS_ENVIRONMENT}" "${INPUTS_VERSION}"
        env:
          TF_LAMBDA_SOURCES_BUCKET: ${{ secrets.TF_LAMBDA_SOURCES_BUCKET }}
          INPUTS_ENVIRONMENT: ${{ inputs.environment }}
          INPUTS_VERSION: ${{ inputs.version }}
